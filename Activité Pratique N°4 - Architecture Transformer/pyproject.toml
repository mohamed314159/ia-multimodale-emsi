[project]
name = "ap4-architecture-transformer"
version = "0.1.0"
description = "Activité Pratique N°4 - Architecture Transformer : RNN, LSTM, Transformer, GPT, BERT et exercices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "torch>=2.14.1",
    "transformers",
]

[dependency-groups]
dev = ["nbconvert"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
